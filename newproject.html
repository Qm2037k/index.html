<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <h1>Calorie Calculator</h1>
        <p class="subtitle">Discover your daily calorie needs</p>

        <form id="calorieForm">
            <div class="gender-options">
                <label>
                    <input type="radio" name="gender" value="male" checked>
                    Male
                </label>
                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>
            </div>

            <div class="form-group">
                <label for="age">Age (years)</label>
                <input type="number" id="age" min="18" max="100"
                       placeholder="Enter your age" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" min="100" max="250"
                           placeholder="e.g. 175" required>
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" min="25" max="350"
                           placeholder="e.g. 70" required>
                </div>
            </div>

            <div class="form-group">
                <label for="activity">Activity Level</label>
                <select id="activity" required>
                    <option value="1.2">Sedentary (little exercise)</option>
                    <option value="1.375">Lightly active (1–3 days/week)</option>
                    <option value="1.55">Moderately active (3–5 days/week)</option>
                    <option value="1.725">Very active (6–7 days/week)</option>
                    <option value="1.9">Extra active (intense activity)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="goal">Your Fitness Goal</label>
                <select id="goal">
                    <option value="maintain">Maintain Weight</option>
                    <option value="lose">Lose Weight</option>
                    <option value="gain">Gain Weight</option>
                </select>
            </div>

            <button type="submit">Calculate Calories</button>
        </form>

        <div id="result" class="result" aria-live="polite" hidden></div>
        <p class="disclaimer">
            Estimates only. Individual calorie needs may vary.
        </p>
    </main>

    <script src="script.js"></script>
</body>
